# Render Blueprint — deploys all services for AP Sachivalayam AI Copilot
# Usage: Connect your GitHub repo at https://dashboard.render.com/blueprints
# Docs: https://render.com/docs/blueprint-spec

# Note: Render free tier only allows ONE PostgreSQL database per account.
# If you don't have one yet, uncomment the databases section below.
# Otherwise, set DATABASE_URL manually in the Render dashboard for each service.
#
# databases:
#   - name: sachivalayam-db
#     plan: free
#     databaseName: sachivalayam
#     user: sachivalayam
#     ipAllowList: []

services:
  # ── Redis (must be defined before services that use it) ──
  - type: redis
    name: sachivalayam-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # ── Main FastAPI Application ──────────────────────────────
  - type: web
    name: sachivalayam-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AP Sachivalayam AI Copilot
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Paste your existing PostgreSQL Internal URL manually
      - key: REDIS_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: STATE_CODE
        value: AP
      - key: DEFAULT_LANGUAGE
        value: te
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: WHISPER_DEVICE
        value: cpu

  # ── Celery Worker (background tasks) ──────────────────────
  - type: worker
    name: sachivalayam-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Paste your existing PostgreSQL Internal URL manually
      - key: REDIS_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: STATE_CODE
        value: AP
      - key: DEFAULT_LANGUAGE
        value: te

  # ── Celery Beat (scheduled tasks) ─────────────────────────
  - type: worker
    name: sachivalayam-beat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Paste your existing PostgreSQL Internal URL manually
      - key: REDIS_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
