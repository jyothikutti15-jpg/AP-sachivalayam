# Render Blueprint — deploys all services for AP Sachivalayam AI Copilot
# Usage: Connect your GitHub repo at https://dashboard.render.com/blueprints
# Docs: https://docs.render.com/blueprint-spec

databases:
  - name: sachivalayam-db
    plan: free
    databaseName: sachivalayam
    user: sachivalayam
    postgresSQLVersion: "16"
    ipAllowList: []

services:
  # ── Main FastAPI Application ──────────────────────────────
  - type: web
    name: sachivalayam-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "AP Sachivalayam AI Copilot"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sachivalayam-db
          property: connectionString
        # Render provides postgresql:// but we need postgresql+asyncpg://
        # This is handled in the start script
      - key: REDIS_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: CLAUDE_MODEL
        value: "claude-sonnet-4-6"
      - key: STATE_CODE
        value: "AP"
      - key: DEFAULT_LANGUAGE
        value: "te"
      - key: WHISPER_MODEL_SIZE
        value: "base"  # Use 'base' on free tier (large-v3 needs GPU)
      - key: WHISPER_DEVICE
        value: "cpu"
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: GSWS_API_KEY
        sync: false

  # ── Celery Worker (background tasks) ──────────────────────
  - type: worker
    name: sachivalayam-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sachivalayam-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: "claude-sonnet-4-6"
      - key: STATE_CODE
        value: "AP"
      - key: DEFAULT_LANGUAGE
        value: "te"
      - key: SECRET_KEY
        generateValue: true

  # ── Celery Beat (scheduled tasks) ─────────────────────────
  - type: worker
    name: sachivalayam-beat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sachivalayam-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: sachivalayam-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # ── Redis ─────────────────────────────────────────────────
  - type: redis
    name: sachivalayam-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
